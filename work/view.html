  <script>
    ['pageswap', 'pagereveal'].forEach(function (t) {
      addEventListener(t, function (e) {
        var v = e.viewTransition; if (!v) return;
        [v.ready, v.finished, v.updateCallbackDone].forEach(function (p) { p.catch(function () {}); });
        if (t !== 'pagereveal') return;
        var pass = function (c) {
          if (c.target !== document.documentElement) return;
          var x = c.clientX, y = c.clientY;
          v.skipTransition();
          v.finished.catch(function () {}).then(function () {
            requestAnimationFrame(function () {
              var a = document.elementFromPoint(x, y); a = a && a.closest('a[href]');
              if (a) a.click();
            });
          });
        };
        document.addEventListener('click', pass, true);
        v.finished.catch(function () {}).then(function () { document.removeEventListener('click', pass, true); });
      });
    });
  </script>
